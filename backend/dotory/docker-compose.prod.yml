services:
  mysql:
    image: mysql:8.0
    container_name: dotory-mysql-prod
    restart: always
    env_file:
      - ../.env.prod
    volumes:
      - mysql-prod-data:/var/lib/mysql
    networks:
      - dotory-prod-net

  redis:
    image: redis:7-alpine
    container_name: dotory-redis-prod
    restart: always
    networks:
      - dotory-prod-net

  backend:
    build:
      context: ../backend/dotory
      dockerfile: Dockerfile
    container_name: dotory-backend-prod
    restart: always
    depends_on:
      - mysql
      - redis
    env_file:
      - .env.prod
    networks:
      - dotory-prod-net

  nginx:
    image: nginx:alpine
    container_name: dotory-nginx-prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dotory-prod-net

volumes:
  mysql-prod-data:

networks:
  dotory-prod-net: