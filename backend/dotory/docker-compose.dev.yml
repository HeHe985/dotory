name: dotory

services:
  mysql:
    image: mysql:8.0
    container_name: dotory-mysql-dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-dev-data:/var/lib/mysql
    networks:
      - dotory-dev-net

  redis:
    image: redis:7-alpine
    container_name: dotory-redis-dev
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - dotory-dev-net

  nginx:
    image: nginx:alpine
    container_name: dotory-nginx-dev
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dotory-dev-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-dev-data:

networks:
  dotory-dev-net: